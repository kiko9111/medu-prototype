<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}html,body{margin:0;padding:0;background:#171310}</style></head><body><meta charset="utf-8">
<title>Sultan Hassan 3D Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed 3D stage; a top chapter band and a bottom dock float over it. Committed dark, cinema-of-stone look. */
:root{
  --bg:#171310; --panel:#211c16e6; --ink:#f2e9d8; --dim:#b7a98d; --gold:#d4b062; --gold-deep:#9c7c35;
  --line:#3a3228; --ok:#7fae6a; --warn:#c96f4a; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Tajawal,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none}
.band{position:fixed;left:0;right:0;z-index:4;display:flex;flex-direction:column;gap:6px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:18px;
  background:linear-gradient(#171310c4 0%,#17131066 55%,transparent 100%)}
.band.bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.band>*{pointer-events:auto}
.title{display:flex;align-items:baseline;gap:10px}
.title b{font-family:Amiri,Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.3px;color:var(--gold)}
.title span{color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.primary{display:flex;gap:6px}
.primary .btn{flex:1;min-width:0;border-color:var(--gold);color:var(--gold);font-weight:600;text-align:center;padding:10px 12px;background:#2a2117e6}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip.ghostly{border-style:dashed;color:var(--gold)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dock{display:flex;align-items:flex-end;gap:10px}
#plan{width:132px;height:132px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
  padding:8px 11px;font:inherit;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.btn.pulse{border-color:var(--gold);color:var(--gold);animation:markpulse 1.3s ease-in-out infinite}
@keyframes markpulse{0%,100%{box-shadow:0 0 0 0 #d4b06200}50%{box-shadow:0 0 0 6px #d4b06255}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}}
#say{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--dim);
  font-size:12.5px;backdrop-filter:blur(6px);max-width:52ch}
#say b{color:var(--ink);font-weight:600}
#say .tier{color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9}
#load h1{font-family:Amiri,Georgia,serif;color:var(--gold);font-weight:700;font-size:26px;margin:0;text-wrap:balance;text-align:center;padding-inline:24px}
#load p{color:var(--dim);margin:0;font-size:13px}
#bar{width:min(260px,70vw);height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0%;background:var(--gold)}
#err{color:var(--warn);max-width:46ch;text-align:center;padding-inline:20px}
.embed #chapters,.embed #elems,.embed .band.bot,.embed #cue{display:none !important}
.embed #thenknob{top:calc((100% - var(--embot, 0px))/2)}
.embed #thenhead,.embed #thenx{top:58px}
@media (max-width:460px){ #say{font-size:12px} #plan{width:112px;height:112px} .title b{font-size:18px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">

<div id="stage"></div>
<div id="cue"></div>
<div id="fade"></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="thenwrap">
  <div id="thenimg"></div>
  <div id="thenbar"><div id="thenknob">&#10231;</div></div>
  <div id="thenhead">Then <small id="thensub"></small></div>
  <button id="thenx" aria-label="Close the then view">✕</button>
  <div id="thencap"></div>
</div>
</div>
<style>
#grain{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.55;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='1' stitchTiles='stitch'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>") repeat;background-size:256px 256px}
#vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(8,6,4,.62) 100%)}
#fade{position:absolute;inset:0;background:#0b0907;opacity:0;pointer-events:none;z-index:5}
#cue{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:none;z-index:6;background:rgba(26,19,11,.85);color:#d4b062;border:1px solid #d4b062;padding:6px 14px;border-radius:20px;font:600 13px system-ui;pointer-events:none;letter-spacing:.3px}
#thenwrap{position:absolute;inset:0;display:none;z-index:2;pointer-events:none}
#thenimg{position:absolute;background-size:100% 100%;background-repeat:no-repeat;filter:grayscale(1) sepia(.62) saturate(1.15) contrast(1.05) brightness(.93);box-shadow:0 0 0 1px rgba(212,176,98,.35)}
#thenbar{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,250,235,.85);pointer-events:auto;cursor:ew-resize;touch-action:none}
#thenhead{position:absolute;left:12px;top:120px;z-index:2;padding:6px 12px;border-radius:12px;font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:#d4b062;background:rgba(23,19,16,.85);border:1px solid #d4b062;pointer-events:none;max-width:70%}
#thenhead small{display:block;font:11px/1.3 system-ui;letter-spacing:0;text-transform:none;color:#cdbd9d}
#thenx{position:absolute;right:12px;top:120px;z-index:3;width:34px;height:34px;border-radius:50%;border:1px solid #d4b062;background:rgba(23,19,16,.85);color:#d4b062;font:600 14px system-ui;cursor:pointer;pointer-events:auto}
#thencap{position:absolute;background:rgba(26,19,11,.82);color:#ead9b5;padding:5px 11px;border-radius:9px;font:12px system-ui;max-width:72%;pointer-events:none}
#thenknob{position:absolute;top:50%;left:1px;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(26,19,11,.85);border:1px solid #d4b062;color:#d4b062;display:flex;align-items:center;justify-content:center;font:600 16px system-ui}
</style>

<div id="load">
  <h1>Sultan Hassan · the stone, live</h1>
  <p id="loadtxt">Loading the model (about 13&nbsp;MB)…</p>
  <div id="bar"><i></i></div>
  <p id="err" hidden></p>
</div>

<div class="band top">
  <div class="title"><b>Sultan Hassan</b><span id="chname">3D guide · 2026</span></div>
  <div class="row" id="chapters" role="tablist" aria-label="Chapters"></div>
  <div class="row" id="elems" aria-label="Named elements"></div>
</div>

<div class="band bot">
  <div class="dock">
    <svg id="plan" viewBox="0 0 132 132" role="img" aria-label="Key plan, tap to stand there"></svg>
    <div class="stack">
      <div id="say"><b>Drag to look around.</b> Tap the plan to stand somewhere, or pick a chapter above. On site, this view turns with your phone.</div>
      <div class="primary" id="primary">
        <button class="btn" id="next" style="display:none">Next stop →</button>
        <button class="btn" id="arrive" style="display:none">I’m on the mark</button>
        <button class="btn" id="enter" style="display:none">Look from the mark ▶</button>
      </div>
      <div class="row">
        <button class="btn" id="overview" aria-pressed="true">Overview</button>
        <button class="btn" id="compass" aria-pressed="false">Compass</button>
        <button class="btn" id="ghosts" aria-pressed="true">Lost parts</button>
        <button class="btn" id="north">Face north</button>
        <button class="btn" id="pmode" aria-pressed="false" style="display:none">Photo</button>
        <button class="btn" id="tmode" aria-pressed="false" style="display:none">Then</button>
        <button class="btn" id="follow" aria-pressed="false" style="display:none">Follow me</button>
      </div>
    </div>
  </div>
</div>
